<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore di Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: pink;
            color: blue;
            text-align: center;
            padding: 20px;
        }
        input, button {
            margin: 10px;
            padding: 10px;
            font-size: 16px;
        }
        button {
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: darkblue;
        }
        #result {
            width: 300px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        function generatePassword() {
            const url = document.getElementById('url').value;
            const password = document.getElementById('password').value;
            const combinedString = url + password;
            const md5Hash = CryptoJS.MD5(combinedString).toString(CryptoJS.enc.Hex);
            const finalPassword = 'X*' + md5Hash.substring(0, 12);
            document.getElementById('result').value = finalPassword;
        }
    </script>
</head>
<body>
    <h1>Generatore di Password</h1>
    <label for="url">Nome servizio o URL:</label><br>
    <input type="text" id="url" name="url"><br>
    <label for="password">Parola segreta:</label><br>
    <input type="password" id="password" name="password"><br>
    <button onclick="generatePassword()">Genera Password</button><br>
    <label for="result">Password:</label><br>
    <input type="text" id="result" name="result" readonly><br>
</body>
</html>
